<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pompeji &#124; Jul Herzberg</title>
    <link rel="stylesheet" href="pompeji.css">
</head>

<body>
    <div class="parallax-section">
        <div class="parallax">
            <img src="images/Pompeji1layer1.png" class="layer layer1" alt="1">
            <img src="images/Pompeji1layer2.png" class="layer layer2" alt="2">
            <img src="images/Pompeji1layer3.png" class="layer layer3" alt="3">
            <img src="images/Pompeji1layer4.png" class="layer layer4" alt="4">
            <img src="images/Pompeji1layer5.png" class="layer layer5" alt="5">
            <img src="images/Pompeji1layer6.png" class="layer layer6" alt="6">
            <img src="images/Pompeji1layer7.png" class="layer layer7" alt="7">

            <div class="prolog">
                <div class="prolog-text">
                    <span>WIR</span>
                    <span>BEFINDEN</span>
                    <span>UNS</span>
                    <span>IM</span>
                    <span>JAHRE</span>
                    <span>79.</span>
                    <span>AN</span>
                    <span>DEN</span>
                    <span>HÄNGEN</span>
                    <span>DES</span>
                    <span>VESUVS</span>
                    <span>LIEGT</span>
                    <span>EINE</span>
                    <span>BLÜHENDE</span>
                    <span>RÖMISCHE</span>
                    <span>STADT...</span>
                </div>
            </div>

            <img src="images/titlelayer1.png" class="title-cloud title-cloud1" alt="">

            <img src="images/titlelayer1.5.png" class="title-cloud title-cloud15" alt="">

            <img src="images/titlelayer2.png" class="title-cloud title-cloud2" alt="">

            <div class="title-screen">
                <h1>
                    <span class="title-small">DIE LETZTEN STUNDEN VON</span>
                    <span class="title-pompeji">POMPEJI</span>
                </h1>
            </div>

            <div class="intro-info">
                <p class="intro-author">Ein Projekt von Jul Herzberg</p>

                <p class="intro-note">
                    Hier können später ein paar kurze Informationen
                    zum Projekt stehen.
                </p>
            </div>
        </div>
    </div>

    <script src="pompejiscript.js"></script>
</body>
</html>
